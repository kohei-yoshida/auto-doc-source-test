<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="calculator" aria-labelledby="title">
      <p class="eyebrow">AUTO-DOC POC</p>
      <h1 id="title">Simple Calculator</h1>
      <p class="intro">Enter two numbers, then choose an operation.</p>
      <div class="inputs">
        <label>First number<input id="left" type="number" step="any" /></label>
        <label>Second number<input id="right" type="number" step="any" /></label>
      </div>
      <div class="operations" aria-label="Operations">
        <button data-operation="+">Add</button>
        <button data-operation="-">Subtract</button>
        <button data-operation="*">Multiply</button>
        <button data-operation="/">Divide</button>
      </div>
      <output id="result" aria-live="polite">Result: —</output>
      <button id="clear" class="secondary">Clear</button>
    </main>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
